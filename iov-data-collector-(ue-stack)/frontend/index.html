    <script>
      // Global error shield to prevent cross-origin third-party script errors from crashing the app
      window.addEventListener('error', function(event) {
        if (event.message === 'Script error.' || !event.filename || event.filename.indexOf('amap.com') !== -1) {
          event.preventDefault && event.preventDefault();
          event.stopPropagation && event.stopPropagation();
          console.warn('[Global Error Handler] Caught external script error:', event);
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function(event) {
        console.warn('[Global Rejection Handler] Caught unhandled rejection:', event.reason);
        event.preventDefault && event.preventDefault();
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
