# 本文件只能使用UTF-8编码, 如果使用其它编码会导致读取失败(Windows API限制). 
# 比如使用windows自带的notepad.exe打开再保存, 就会导致读取失败


[HiAgent]
# 写dtfx文件默认开关, 默认是1. 1:打开, 0:关闭
WRITE_DTFX_FILE_SWITCH = 0

# dtfx文件保存的路径, 可以是全路径, 比如C:\dtfx\dtfx_file, 或者相对路径, 比如 ..\bb\prefix 必须保证文件夹一定是存在的!!!!!!
# 默认是"dtfx\dtfx_file", dtfx是文件夹, dtfx_file是文件名的前缀(最后一个\后面的是后缀名)
DTFX_SAVE_PATH = "dtfx\dtfx_file"

# dtfx文件的大小, 默认值是1024, 单位MB. 该值的可配置范围是[50, 1024]
DTFX_FILE_SIZE = 1024

# 和单板之间的连接类型, 默认值是3. 你可以这么理解. 0: 调用ucm.exe连接, 3:用dll直接连接
CONNNECT_TYPE = 3

# 过滤文件保存的路径, 默认值是HiStudio_Cmd_Drive_Test_Config.xml 可以是全路径, 比如C:\a.xml, 或者相对路径, 比如 ..\b.xml, 必须保证文件一定是存在的!!!!!!
MSG_FILTER_CFG_PATH = "HiStudio_Cmd_Drive_Test_Config.xml"

